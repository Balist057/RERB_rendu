# Build et push l'image Docker automatiquement via GitHub Actions.

name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - "bot_collect/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: rerbcollect

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./bot_collect
          file: ./bot_collect/deploy/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/Balist057/RERB_rendu
          tags: |
            ghcr.io/balist057/${{ env.IMAGE_NAME }}:latest
            ghcr.io/balist057/${{ env.IMAGE_NAME }}:${{ github.sha }}
